plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ohli.floatingai'
    compileSdk 36

    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.ohli.floatingai'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        def gatewayUrl = (System.getenv('AI_GATEWAY_URL') ?: project.findProperty('AI_GATEWAY_URL') ?: '').toString().replace('"', '')
        buildConfigField("String", "AI_GATEWAY_URL", "\"${gatewayUrl}\"")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
